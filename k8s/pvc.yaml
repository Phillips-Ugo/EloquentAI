apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eloquent-ai-database-pvc
  namespace: eloquent-ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eloquent-ai-uploads-pvc
  namespace: eloquent-ai
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eloquent-ai-logs-pvc
  namespace: eloquent-ai
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
