apiVersion: apps/v1
kind: Deployment
metadata:
  name: eloquent-ai
  namespace: eloquent-ai
  labels:
    app: eloquent-ai
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: eloquent-ai
  template:
    metadata:
      labels:
        app: eloquent-ai
        version: v1
    spec:
      containers:
      - name: eloquent-ai
        image: ghcr.io/your-username/eloquent-ai:latest
        ports:
        - containerPort: 5001
          name: http
        - containerPort: 3000
          name: frontend
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5001"
        - name: DATABASE_PATH
          value: "/app/database/eloquent_ai.db"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: eloquent-ai-secrets
              key: smtp-host
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: eloquent-ai-secrets
              key: smtp-user
        - name: SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: eloquent-ai-secrets
              key: smtp-pass
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: eloquent-ai-secrets
              key: openai-api-key
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: eloquent-ai-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: database-storage
          mountPath: /app/database
        - name: uploads-storage
          mountPath: /app/uploads
        - name: logs-storage
          mountPath: /app/logs
      volumes:
      - name: database-storage
        persistentVolumeClaim:
          claimName: eloquent-ai-database-pvc
      - name: uploads-storage
        persistentVolumeClaim:
          claimName: eloquent-ai-uploads-pvc
      - name: logs-storage
        persistentVolumeClaim:
          claimName: eloquent-ai-logs-pvc
      restartPolicy: Always
